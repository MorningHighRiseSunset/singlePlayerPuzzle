<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Puzzle Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link rel="stylesheet" href="homeScreen.css">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  </head>
  <body>
    <div class="home-container">
      <div class="mini-board-container">
        <div class="mini-scrabble-board">
          <!-- 9x9 Mini Board, center cell has fleur-de-lis -->
          <!-- You can adjust the number of rows/cells as needed -->
          <!-- Center row is row 4 (0-based), center cell is cell 4 -->
          <!-- Premium squares: tw, dw, tl, dl, center-symbol -->
          <!-- Example layout for a 9x9 board -->
          <div class="mini-row">
            <div class="mini-cell tw"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell tw"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell tw"></div>
          </div>
          <div class="mini-row">
            <div class="mini-cell"></div>
            <div class="mini-cell tl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell tl"></div>
            <div class="mini-cell"></div>
          </div>
          <div class="mini-row">
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell tl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell tl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
          </div>
          <div class="mini-row">
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dw"></div>
            <div class="mini-cell tl"></div>
            <div class="mini-cell dw"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
          </div>
          <div class="mini-row">
            <div class="mini-cell tw"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell tl"></div>
            <div class="mini-cell dw center-symbol"></div>
            <div class="mini-cell tl"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell tw"></div>
          </div>
          <div class="mini-row">
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dw"></div>
            <div class="mini-cell tl"></div>
            <div class="mini-cell dw"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
          </div>
          <div class="mini-row">
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell tl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell tl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
          </div>
          <div class="mini-row">
            <div class="mini-cell"></div>
            <div class="mini-cell tl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell tl"></div>
            <div class="mini-cell"></div>
          </div>
          <div class="mini-row">
            <div class="mini-cell tw"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell tw"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell dl"></div>
            <div class="mini-cell"></div>
            <div class="mini-cell tw"></div>
          </div>
        </div>
      </div>
      <!-- Main Menu Buttons -->
      <div class="mode-buttons-container" id="mainMenu" style="display: none;">
        <button class="mode-btn" id="singlePlayerBtn">👤 Single Player</button>
        <button class="mode-btn" id="multiplayerBtn">👥 Multiplayer</button>
      </div>

      <!-- Language Selection Screen (Hidden by default) -->
      <div class="language-buttons-container" id="languageScreen" style="display: none;">
        <button class="back-btn" id="backToMenuBtn">← Back</button>
        <button class="lang-btn" data-language="english" data-href="game.html">🇺🇸 English</button>
        <button class="lang-btn" data-language="french" data-href="french.html">🇫🇷 French</button>
        <button class="lang-btn" data-language="hindi" data-href="hindi.html">🇮🇳 Hindi</button>
        <button class="lang-btn" data-language="mandarin" data-href="mandarin.html">🇨🇳 Mandarin</button>
        <button class="lang-btn" data-language="spanish" data-href="spanish.html">🇪🇸 Spanish</button>
      </div>

      <!-- Multiplayer Lobby Screen (Hidden by default) -->
      <div class="lobby-content" id="lobbyScreen" style="display: none;">
        <button class="back-btn" id="backToMenuFromLobbyBtn">← Back</button>
        <h2>Multiplayer Lobby</h2>
        <div class="language-selection-container">
          <h3>Select Language</h3>
          <div class="language-buttons-container multiplayer-languages">
            <button class="lang-btn multiplayer-lang-btn" data-language="english">🇺🇸 English</button>
          </div>
        </div>
        <div class="create-game-container">
          <button class="create-game-btn" id="createGameBtn">🎮 Create Game</button>
        </div>
        <div class="active-games-container">
          <h3>Active Games</h3>
          <div class="games-list" id="gamesList">
            <p class="no-games-message">No active games available</p>
          </div>
        </div>
      </div>
    </div>
    <!-- Pusher for real-time multiplayer -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script src="homeScreen.js"></script>
  </body>
</html>
